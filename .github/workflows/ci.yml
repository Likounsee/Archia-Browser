name: Archia Browser CI

permissions:
  contents: read

concurrency:
  group: archia-browser-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["Archia-Browser"]
  pull_request:

jobs:
  check:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve the new shared GPU UI dependency graph
        run: cargo generate-lockfile
      - name: Preserve resolved lockfile for pinning
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: archia-browser-wgpu-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
      - name: Verify dependency resolution
        run: cargo metadata --format-version 1 --no-deps
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Audit Rust dependencies against RustSec advisories
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings
      - name: Audit dependency license expressions
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deny --locked
          cargo deny check licenses
