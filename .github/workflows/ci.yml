name: Archia Browser CI

on:
  push:
    branches: ["Archia-Browser"]
  pull_request:

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: timeout 30s cargo test --workspace net::loader::tests::document_loads_are_marked_as_document_resources -- --exact --nocapture
      - run: cargo build --workspace
