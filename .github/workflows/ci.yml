name: Archia Browser CI

# CI only reads source and dependencies; do not grant repository write access.
permissions:
  contents: read

concurrency:
  group: archia-browser-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["Archia-Browser"]
  pull_request:

jobs:
  check:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify pinned dependency resolution
        run: cargo metadata --locked --format-version 1 --no-deps
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Audit Rust dependencies against RustSec advisories
        if: runner.os == 'Linux'
        run: |
          # These are transitive, unmaintained crates in the egui/wgpu font/macro
          # stack, not known exploitable vulnerabilities. Keep the rest of the
          # RustSec audit strict and revisit these exceptions on dependency updates.
          cargo install cargo-audit --locked
          cargo audit --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0192 --deny warnings
      - name: Audit dependency license expressions
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deny --locked
          cargo deny check licenses
