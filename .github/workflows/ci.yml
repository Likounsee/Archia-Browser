name: Archia Browser CI

concurrency:
  group: archia-browser-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["Archia-Browser"]
  pull_request:

jobs:
  check:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify pinned dependency resolution
        run: cargo metadata --locked --format-version 1 --no-deps
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Audit Rust dependencies against RustSec advisories
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings
      - name: Audit dependency license expressions
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deny --locked
          cargo deny check licenses
