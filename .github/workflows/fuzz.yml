name: Archia Browser URL fuzzing

concurrency:
  group: archia-browser-fuzz-${{ github.ref }}
  cancel-in-progress: false

on:
  # Run the long campaign deliberately, when P0 hardening is ready for it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  url-fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Each target receives about 3 h 25 min 43 s of fuzzing time.
    # Keep setup overhead inside a job timeout below the hosted-runner limit.
    timeout-minutes: 225
    strategy:
      fail-fast: false
      matrix:
        target:
          - http_response
          - url_parse_resolve
          - html_tokenize_parse
          - css_tokenize
          - css_stylesheet
          - css_selector
          - cookie_parse
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Archia-Browser

      - uses: dtolnay/rust-toolchain@stable

      - name: Install nightly for cargo-fuzz
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build all fuzz targets
        run: cargo +nightly fuzz build
        working-directory: fuzz

      - name: Fuzz ${{ matrix.target }} for its allocated budget
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time=12343 -print_final_stats=1 2>&1 | tee "artifacts/${{ matrix.target }}-run.log"
        working-directory: fuzz

      - name: Upload fuzz logs and crash inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archia-browser-fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: warn
          retention-days: 14
