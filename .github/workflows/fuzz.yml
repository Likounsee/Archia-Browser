name: Archia Browser URL fuzzing

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: ["Archia-Browser"]
    paths:
      - "fuzz/**"
      - "Archia-Browser/src/net/url.rs"
      - "Archia-Browser/src/net/cookies.rs"
      - "Archia-Browser/src/net/transport.rs"
      - "Archia-Browser/src/html/**"
      - "Archia-Browser/src/css/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

jobs:
  url-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Archia-Browser
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nightly for cargo-fuzz
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build all fuzz targets
        run: cargo +nightly fuzz build
        working-directory: fuzz
      - name: Fuzz HTTP response framing
        run: cargo +nightly fuzz run http_response -- -max_total_time=90 -print_final_stats=1
        working-directory: fuzz
      - name: Fuzz URL parsing and resolution
        run: cargo +nightly fuzz run url_parse_resolve -- -max_total_time=90 -print_final_stats=1
        working-directory: fuzz
      - name: Fuzz HTML tokenization and DOM parsing
        run: cargo +nightly fuzz run html_tokenize_parse -- -max_total_time=90 -print_final_stats=1
        working-directory: fuzz
      - name: Fuzz CSS tokenization
        run: cargo +nightly fuzz run css_tokenize -- -max_total_time=90 -print_final_stats=1
        working-directory: fuzz
      - name: Fuzz CSS stylesheet parsing
        run: cargo +nightly fuzz run css_stylesheet -- -max_total_time=90 -print_final_stats=1
        working-directory: fuzz
      - name: Fuzz CSS selector parsing
        run: cargo +nightly fuzz run css_selector -- -max_total_time=90 -print_final_stats=1
        working-directory: fuzz
      - name: Fuzz cookie parsing and selection
        run: cargo +nightly fuzz run cookie_parse -- -max_total_time=90 -print_final_stats=1
        working-directory: fuzz
      - name: Upload crashing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archia-browser-fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
