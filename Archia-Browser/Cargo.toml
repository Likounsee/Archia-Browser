[package]
name = "archia-browser"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A lightweight, independent web browser built from the ground up."

[features]
default = ["software-renderer"]
# Transitional pixel backend; the browser engine builds without this feature.
software-renderer = ["dep:ab_glyph", "dep:eframe"]

[[bin]]
name = "archia-browser"
path = "src/main.rs"
required-features = ["software-renderer"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("archiaos"))'] }

[dependencies]
ab_glyph = { version = "0.2.32", optional = true }
rustls = "0.23"
webpki-roots = "1.0"
psl = "2"
httpdate = "1"
libc = "0.2"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"], optional = true }
